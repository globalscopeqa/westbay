name: Check System

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check for OS, Docker image, and network updates
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            set -euo pipefail

            echo "--- Disk usage before cleanup ---"
            df -h /

            echo "--- Largest directories ---"
            sudo du -sh /var/log /var/cache /var/lib/docker /opt /home /root /tmp 2>/dev/null | sort -rh || true

            echo "--- Files over 200MB outside app data (report only, not deleted) ---"
            sudo find / -xdev -type f -size +200M \
              -not -path "/var/lib/docker/*" \
              -not -path "/opt/odoo/*" \
              2>/dev/null || true

            echo "--- Safe cleanup: apt cache, orphaned packages, old journal logs ---"
            sudo apt-get autoremove -y
            sudo apt-get clean
            sudo journalctl --vacuum-time=7d || true

            echo "--- OS package updates ---"
            sudo apt-get update -q
            apt list --upgradable 2>/dev/null || true

            echo "--- Applying OS package upgrades ---"
            sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y
            if [ -f /var/run/reboot-required ]; then
              echo "--- Reboot required after these updates ---"
              cat /var/run/reboot-required.pkgs 2>/dev/null || true
            fi

            echo "--- Removing unused Docker images ---"
            sudo docker image prune -af

            echo "--- Docker images currently in use ---"
            sudo docker images

            echo "--- Checking for newer Odoo/Postgres images ---"
            cd /opt/odoo
            sudo docker compose pull

            echo "--- Harden: firewall + fail2ban ---"
            sudo apt-get install -y ufw fail2ban
            sudo ufw allow 22/tcp
            sudo ufw allow 80/tcp
            sudo ufw allow 443/tcp
            sudo ufw --force enable
            sudo systemctl enable --now fail2ban

            echo "--- ufw status ---"
            sudo ufw status verbose || true

            echo "--- fail2ban status ---"
            sudo fail2ban-client status || true
            sudo fail2ban-client status sshd || true

            echo "--- Harden: safe Lynis suggestions (idempotent) ---"
            sudo apt-get install -y libpam-tmpdir debsums apt-show-versions auditd acct

            echo "-- fail2ban: protect config from being overwritten by package updates --"
            if [ ! -f /etc/fail2ban/jail.local ]; then
              sudo cp /etc/fail2ban/jail.conf /etc/fail2ban/jail.local
              sudo systemctl restart fail2ban
            fi

            echo "-- login.defs: password aging, hashing rounds, stricter umask --"
            sudo sed -i 's/^PASS_MAX_DAYS.*/PASS_MAX_DAYS\t90/' /etc/login.defs
            sudo sed -i 's/^PASS_MIN_DAYS.*/PASS_MIN_DAYS\t7/' /etc/login.defs
            sudo sed -i 's/^UMASK.*/UMASK\t027/' /etc/login.defs
            grep -q "^SHA_CRYPT_MIN_ROUNDS" /etc/login.defs || echo "SHA_CRYPT_MIN_ROUNDS 5000" | sudo tee -a /etc/login.defs > /dev/null
            grep -q "^SHA_CRYPT_MAX_ROUNDS" /etc/login.defs || echo "SHA_CRYPT_MAX_ROUNDS 100000" | sudo tee -a /etc/login.defs > /dev/null

            echo "-- legal banners --"
            echo "Authorized access only. All activity may be monitored and reported." | sudo tee /etc/issue > /dev/null
            echo "Authorized access only. All activity may be monitored and reported." | sudo tee /etc/issue.net > /dev/null

            echo "-- sshd: LogLevel + MaxSessions (port 22 stays unchanged, per standing instruction) --"
            set_sshd_opt() {
              local key="$1" val="$2"
              if grep -qE "^${key}[[:space:]]" /etc/ssh/sshd_config; then
                sudo sed -i "s/^${key}[[:space:]].*/${key} ${val}/" /etc/ssh/sshd_config
              elif grep -qE "^#[[:space:]]*${key}[[:space:]]" /etc/ssh/sshd_config; then
                sudo sed -i "s/^#[[:space:]]*${key}[[:space:]].*/${key} ${val}/" /etc/ssh/sshd_config
              else
                echo "${key} ${val}" | sudo tee -a /etc/ssh/sshd_config > /dev/null
              fi
            }
            set_sshd_opt LogLevel VERBOSE
            set_sshd_opt MaxSessions 2
            sudo sshd -t && sudo systemctl reload ssh

            echo "-- restrict compilers to root (standard hardening; host only runs containers, no host-level builds) --"
            for c in /usr/bin/gcc* /usr/bin/cc /usr/bin/as /usr/bin/ld; do
              [ -e "$c" ] && sudo chmod 750 "$c" && sudo chown root:root "$c" || true
            done

            echo "-- sysctl hardening (safe subset - leaves net.ipv4.ip_forward alone, Docker needs it) --"
            sudo tee /etc/sysctl.d/99-hardening.conf > /dev/null <<'SYSCTL'
            net.ipv4.conf.all.accept_redirects = 0
            net.ipv4.conf.all.secure_redirects = 0
            net.ipv4.conf.all.send_redirects = 0
            net.ipv4.conf.all.accept_source_route = 0
            net.ipv4.conf.all.log_martians = 1
            net.ipv4.tcp_syncookies = 1
            kernel.randomize_va_space = 2
            fs.suid_dumpable = 0
            SYSCTL
            sudo sysctl --system > /dev/null

            echo "-- purge old/removed package configs --"
            REMOVED_PKGS=$(dpkg -l | awk '/^rc/ {print $2}')
            if [ -n "$REMOVED_PKGS" ]; then
              sudo apt-get -y purge $REMOVED_PKGS
            fi

            echo "-- process accounting + auditd --"
            sudo systemctl enable --now acct 2>/dev/null || sudo systemctl enable --now psacct 2>/dev/null || true
            sudo systemctl enable --now auditd || true

            echo "-- automatic security updates (unattended-upgrades) --"
            sudo apt-get install -y unattended-upgrades
            sudo tee /etc/apt/apt.conf.d/20auto-upgrades > /dev/null <<'EOF'
            APT::Periodic::Update-Package-Lists "1";
            APT::Periodic::Download-Upgradeable-Packages "1";
            APT::Periodic::AutocleanInterval "7";
            APT::Periodic::Unattended-Upgrade "1";
            EOF
            sudo tee /etc/apt/apt.conf.d/50unattended-upgrades > /dev/null <<'EOF'
            Unattended-Upgrade::Allowed-Origins {
                "${distro_id}:${distro_codename}-security";
                "${distro_id}ESMApps:${distro_codename}-apps-security";
                "${distro_id}ESM:${distro_codename}-infra-security";
            };
            Unattended-Upgrade::Remove-Unused-Dependencies "true";
            Unattended-Upgrade::Automatic-Reboot "false";
            Unattended-Upgrade::SyslogEnable "true";
            EOF
            sudo systemctl enable --now unattended-upgrades || true
            echo "-- dry-run to confirm the config is valid (security origins only, no auto-reboot) --"
            sudo unattended-upgrade --dry-run --debug 2>&1 | tail -30 || true

            echo "--- Ports listening ---"
            sudo ss -tlnp | grep -E ':80 |:443 |:8069|:8072' || true

            echo "--- Odoo reachability from inside the VPS itself ---"
            curl -sS -w "\nlocal http://127.0.0.1:8069 -> %{http_code}\n" --max-time 5 http://127.0.0.1:8069/ || echo "local request to 8069 failed"

            echo "--- extra-addons contents ---"
            sudo docker exec odoo-odoo-1 ls -la /mnt/extra-addons || true

            echo "--- Odoo container status ---"
            sudo docker ps -a --filter name=odoo || true

            echo "--- Odoo container logs (last 80 lines) ---"
            sudo docker logs --tail 80 odoo-odoo-1 || true

            echo "--- Disk usage after cleanup ---"
            df -h /
