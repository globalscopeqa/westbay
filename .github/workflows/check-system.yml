name: Check System

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check for OS, Docker image, and network updates
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            set -euo pipefail

            echo "--- Disk usage before cleanup ---"
            df -h /

            echo "--- Largest directories ---"
            sudo du -sh /var/log /var/cache /var/lib/docker /opt /home /root /tmp 2>/dev/null | sort -rh || true

            echo "--- Files over 200MB outside app data (report only, not deleted) ---"
            sudo find / -xdev -type f -size +200M \
              -not -path "/var/lib/docker/*" \
              -not -path "/opt/odoo/*" \
              2>/dev/null || true

            echo "--- Safe cleanup: apt cache, orphaned packages, old journal logs ---"
            sudo apt-get autoremove -y
            sudo apt-get clean
            sudo journalctl --vacuum-time=7d || true

            echo "--- OS package updates ---"
            sudo apt-get update -q
            apt list --upgradable 2>/dev/null || true

            echo "--- Applying OS package upgrades ---"
            sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y
            if [ -f /var/run/reboot-required ]; then
              echo "--- Reboot required after these updates ---"
              cat /var/run/reboot-required.pkgs 2>/dev/null || true
            fi

            echo "--- Removing unused Docker images ---"
            sudo docker image prune -af

            echo "--- Docker images currently in use ---"
            sudo docker images

            echo "--- Checking for newer Odoo/Postgres images ---"
            cd /opt/odoo
            sudo docker compose pull

            echo "--- Harden: firewall + fail2ban ---"
            sudo apt-get install -y ufw fail2ban
            sudo ufw allow 22/tcp
            sudo ufw allow 80/tcp
            sudo ufw allow 443/tcp
            sudo ufw --force enable
            sudo systemctl enable --now fail2ban

            echo "--- ufw status ---"
            sudo ufw status verbose || true

            echo "--- fail2ban status ---"
            sudo fail2ban-client status || true
            sudo fail2ban-client status sshd || true

            echo "--- Ports listening ---"
            sudo ss -tlnp | grep -E ':80 |:443 |:8069|:8072' || true

            echo "--- Odoo reachability from inside the VPS itself ---"
            curl -sS -w "\nlocal http://127.0.0.1:8069 -> %{http_code}\n" --max-time 5 http://127.0.0.1:8069/ || echo "local request to 8069 failed"

            echo "--- extra-addons contents ---"
            sudo docker exec odoo-odoo-1 ls -la /mnt/extra-addons

            echo "--- Odoo container status ---"
            sudo docker ps -a --filter name=odoo

            echo "--- Odoo container logs (last 80 lines) ---"
            sudo docker logs --tail 80 odoo-odoo-1

            echo "--- Disk usage after cleanup ---"
            df -h /

            echo "--- ONE-TIME: trace origin of unexpected database avx42c963a26f ---"
            echo "-- Postgres: all databases with size and owner --"
            sudo docker exec odoo-db-1 psql -U odoo -d postgres -c \
              "SELECT datname, pg_size_pretty(pg_database_size(datname)) AS size, pg_get_userbyid(datdba) AS owner FROM pg_database WHERE datistemplate = false;" || true

            echo "-- Postgres: OID + on-disk mtime (creation-ish timestamp) for avx42c963a26f --"
            DBOID=$(sudo docker exec odoo-db-1 psql -U odoo -d postgres -tAc "SELECT oid FROM pg_database WHERE datname='avx42c963a26f';" 2>/dev/null || true)
            echo "oid: $DBOID"
            if [ -n "$DBOID" ]; then
              sudo docker exec odoo-db-1 stat "/var/lib/postgresql/data/base/$DBOID" || true
            fi

            echo "-- Odoo container logs: full history, filtered for database create/manager/avx42c963a26f --"
            sudo docker logs odoo-odoo-1 2>&1 | grep -iE "database/(manager|create|duplicate|drop)|avx42c963a26f|createdb" | tail -100 || true

            echo "-- nginx access logs: hits on Odoo database-manager endpoints (all rotated logs) --"
            sudo zgrep -aE "database/(manager|create|duplicate|drop)|/web/database" /var/log/nginx/access.log* 2>/dev/null | tail -100 || true

            echo "-- odoo.conf: is the database manager/list exposed? --"
            sudo docker exec odoo-odoo-1 cat /etc/odoo/odoo.conf || true
