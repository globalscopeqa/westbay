<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F7F6; --surface:#FFFFFF; --border:#D9E3E0; --ink:#0E2A2E; --ink-soft:#4C6469;
    --teal:#14535C; --turquoise:#178C82;
    --font-body:'Roboto','Segoe UI',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#0A1E21; --surface:#0F2B2E; --border:#1D4348; --ink:#E7F2F0; --ink-soft:#A9C1C0; --teal:#7FD3C9; --turquoise:#3FD9C9; }
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--ink); font-family:var(--font-body); text-align:center; padding:24px;}
  .code{font-size:5rem; font-weight:800; color:var(--teal); line-height:1; margin:0 0 8px;}
  h1{font-size:1.5rem; margin:0 0 12px;}
  p{color:var(--ink-soft); max-width:40ch; margin:0 auto 28px; line-height:1.6;}
  a.btn{display:inline-block; background:var(--teal); color:#fff; text-decoration:none; font-weight:600; padding:12px 28px; border-radius:999px;}
  a.btn:hover{background:var(--turquoise);}
</style>
</head>
<body>
<div>
  <p class="code">404</p>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or may have moved.</p>
  <a class="btn" href="/">Back to homepage</a>
</div>
</body>
</html>
