name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude=".git*" --exclude=".github" --exclude="odoo-addons" --exclude="SERVER-SETUP.md" --exclude="README.md" --exclude="deploy"
          path: ./
          remote_path: /var/www/westbaycomputer.com/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Configure nginx and reload
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            set -euo pipefail
            sudo tee /etc/nginx/sites-available/westbaycomputer.conf > /dev/null <<'NGINX'
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                server_name westbaycomputer.com www.westbaycomputer.com 97.74.81.110;

                root /var/www/westbaycomputer.com;
                index index.html;

                error_page 404 /404.html;
                location = /404.html {
                    internal;
                }

                location /profile/ {
                    rewrite ^/profile/(.*)$ https://profile.westbaycomputer.com/$1 permanent;
                }

                location / {
                    try_files $uri $uri/ =404;
                }

                location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                    expires 30d;
                    add_header Cache-Control "public, immutable";
                }
            }

            server {
                listen 80;
                listen [::]:80;
                server_name profile.westbaycomputer.com;

                root /var/www/westbaycomputer.com/profile;
                index index.html;

                location / {
                    try_files $uri $uri/ =404;
                }

                location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
                    expires 30d;
                    add_header Cache-Control "public, immutable";
                }
            }
            NGINX
            sudo rm -f /etc/nginx/sites-enabled/default
            sudo rm -f /etc/nginx/sites-enabled/westbaycomputer.com /etc/nginx/sites-available/westbaycomputer.com
            sudo ln -sf /etc/nginx/sites-available/westbaycomputer.conf /etc/nginx/sites-enabled/westbaycomputer.conf
            sudo nginx -t
            sudo systemctl reload nginx

      - name: Obtain/renew TLS cert and force HTTPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            set -euo pipefail
            if ! command -v certbot >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y certbot python3-certbot-nginx
            fi
            sudo certbot --nginx \
              -d westbaycomputer.com -d www.westbaycomputer.com -d profile.westbaycomputer.com \
              --non-interactive --agree-tos -m info@westbaycomputer.com \
              --redirect --expand
            sudo nginx -t
            sudo systemctl reload nginx
