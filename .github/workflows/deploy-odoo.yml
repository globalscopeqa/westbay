name: Deploy Odoo

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  deploy-odoo:
    runs-on: ubuntu-latest
    steps:
      - name: Install Docker, bring up Odoo + Postgres, configure nginx + TLS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            set -euo pipefail

            echo "--- Resources ---"
            free -h
            df -h /

            echo "--- OS ---"
            . /etc/os-release
            echo "Detected: $ID $VERSION_CODENAME"
            if [ "$ID" != "ubuntu" ]; then
              echo "This workflow requires Ubuntu; detected '$ID' instead. Aborting." >&2
              exit 1
            fi
            DOCKER_REPO_OS="ubuntu"

            echo "--- Docker ---"
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL "https://download.docker.com/linux/${DOCKER_REPO_OS}/gpg" | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/${DOCKER_REPO_OS} ${VERSION_CODENAME} stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
            fi

            echo "--- Odoo stack ---"
            sudo mkdir -p /opt/odoo
            if [ ! -f /opt/odoo/.env ]; then
              echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" | sudo tee /opt/odoo/.env > /dev/null
              sudo chmod 600 /opt/odoo/.env
            fi

            sudo tee /opt/odoo/docker-compose.yml > /dev/null <<'COMPOSE'
            services:
              db:
                image: postgres:15
                restart: unless-stopped
                environment:
                  POSTGRES_DB: postgres
                  POSTGRES_USER: odoo
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                volumes:
                  - odoo-db-data:/var/lib/postgresql/data

              odoo:
                image: odoo:17.0
                restart: unless-stopped
                depends_on:
                  - db
                environment:
                  HOST: db
                  USER: odoo
                  PASSWORD: ${POSTGRES_PASSWORD}
                ports:
                  - "8069:8069"
                  - "8072:8072"
                volumes:
                  - odoo-web-data:/var/lib/odoo
                  - odoo-addons:/mnt/extra-addons

            volumes:
              odoo-db-data:
              odoo-web-data:
              odoo-addons:
            COMPOSE

            cd /opt/odoo
            sudo docker compose up -d

            if sudo ufw status | grep -q "Status: active"; then
              sudo ufw allow 8069/tcp
              sudo ufw allow 8072/tcp
            fi

            echo "--- nginx reverse proxy for erp.westbaycomputer.com ---"
            sudo tee /etc/nginx/sites-available/erp.westbaycomputer.com.conf > /dev/null <<'NGINX'
            server {
                listen 80;
                listen [::]:80;
                server_name erp.westbaycomputer.com;

                proxy_read_timeout 720s;
                proxy_connect_timeout 720s;
                proxy_send_timeout 720s;
                client_max_body_size 100m;

                location /longpolling {
                    proxy_pass http://127.0.0.1:8072;
                    proxy_set_header Host $host;
                    proxy_set_header X-Forwarded-Host $host;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location / {
                    proxy_pass http://127.0.0.1:8069;
                    proxy_set_header Host $host;
                    proxy_set_header X-Forwarded-Host $host;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_redirect off;
                }

                add_header X-Frame-Options "SAMEORIGIN";
            }
            NGINX
            sudo ln -sf /etc/nginx/sites-available/erp.westbaycomputer.com.conf /etc/nginx/sites-enabled/erp.westbaycomputer.com.conf
            sudo nginx -t
            sudo systemctl reload nginx

            echo "--- TLS for erp.westbaycomputer.com ---"
            if ! command -v certbot >/dev/null 2>&1; then
              sudo apt-get install -y certbot python3-certbot-nginx
            fi
            sudo certbot --nginx -d erp.westbaycomputer.com \
              --non-interactive --agree-tos -m info@westbaycomputer.com \
              --redirect || echo "certbot failed - check that DNS for erp.westbaycomputer.com points at this server yet, then re-run this workflow"
