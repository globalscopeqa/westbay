name: Deploy Odoo

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  deploy-odoo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare addons directory on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            set -euo pipefail
            sudo mkdir -p /opt/odoo/addons
            sudo chown -R "$(whoami):$(whoami)" /opt/odoo/addons

      - name: Sync custom Odoo addons to VPS
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude="custom_backend_theme"
          path: ./odoo-addons/
          remote_path: /opt/odoo/addons/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_DEPLOY_KEY }}

      - name: Install Docker, bring up Odoo + Postgres, configure nginx + TLS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            set -euo pipefail

            echo "--- Resources ---"
            free -h
            df -h /

            echo "--- OS ---"
            . /etc/os-release
            echo "Detected: $ID $VERSION_CODENAME"
            if [ "$ID" != "ubuntu" ]; then
              echo "This workflow requires Ubuntu; detected '$ID' instead. Aborting." >&2
              exit 1
            fi
            DOCKER_REPO_OS="ubuntu"

            echo "--- Docker ---"
            if ! command -v docker >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y ca-certificates curl gnupg
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL "https://download.docker.com/linux/${DOCKER_REPO_OS}/gpg" | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo \
                "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/${DOCKER_REPO_OS} ${VERSION_CODENAME} stable" | \
                sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
            fi

            echo "--- Odoo stack ---"
            sudo mkdir -p /opt/odoo
            if [ ! -f /opt/odoo/.env ]; then
              echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" | sudo tee /opt/odoo/.env > /dev/null
              sudo chmod 600 /opt/odoo/.env
            fi

            sudo tee /opt/odoo/docker-compose.yml > /dev/null <<'COMPOSE'
            services:
              db:
                image: postgres:15
                restart: unless-stopped
                environment:
                  POSTGRES_DB: postgres
                  POSTGRES_USER: odoo
                  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
                volumes:
                  - odoo-db-data:/var/lib/postgresql/data

              odoo:
                image: odoo:19.0
                restart: unless-stopped
                depends_on:
                  - db
                environment:
                  HOST: db
                  USER: odoo
                  PASSWORD: ${POSTGRES_PASSWORD}
                ports:
                  - "8069:8069"
                  - "8072:8072"
                volumes:
                  - odoo-web-data:/var/lib/odoo
                  - /opt/odoo/addons:/mnt/extra-addons

            volumes:
              odoo-db-data:
              odoo-web-data:
            COMPOSE

            sudo chmod -R a+rX /opt/odoo/addons

            cd /opt/odoo
            sudo docker compose up -d

            if sudo ufw status | grep -q "Status: active"; then
              sudo ufw allow 8069/tcp
              sudo ufw allow 8072/tcp
            fi

            echo "--- nginx reverse proxy for erp.westbaycomputer.com ---"
            sudo tee /etc/nginx/sites-available/erp.westbaycomputer.com.conf > /dev/null <<'NGINX'
            server {
                listen 80;
                listen [::]:80;
                server_name erp.westbaycomputer.com;

                proxy_read_timeout 720s;
                proxy_connect_timeout 720s;
                proxy_send_timeout 720s;
                client_max_body_size 100m;

                location /longpolling {
                    proxy_pass http://127.0.0.1:8072;
                    proxy_set_header Host $host;
                    proxy_set_header X-Forwarded-Host $host;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                }

                location / {
                    proxy_pass http://127.0.0.1:8069;
                    proxy_set_header Host $host;
                    proxy_set_header X-Forwarded-Host $host;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_redirect off;
                }

                add_header X-Frame-Options "SAMEORIGIN";
            }
            NGINX
            sudo ln -sf /etc/nginx/sites-available/erp.westbaycomputer.com.conf /etc/nginx/sites-enabled/erp.westbaycomputer.com.conf
            sudo nginx -t
            sudo systemctl reload nginx

            echo "--- TLS for erp.westbaycomputer.com ---"
            if ! command -v certbot >/dev/null 2>&1; then
              sudo apt-get install -y certbot python3-certbot-nginx
            fi
            sudo certbot --nginx -d erp.westbaycomputer.com \
              --non-interactive --agree-tos -m info@westbaycomputer.com \
              --redirect || echo "certbot failed - check that DNS for erp.westbaycomputer.com points at this server yet, then re-run this workflow"

      - name: Install/update custom_login_branding addon
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            set -euo pipefail

            echo "--- Waiting for Odoo to accept requests ---"
            ok=""
            for i in $(seq 1 15); do
              if curl -sS --max-time 5 -o /dev/null http://127.0.0.1:8069/web/database/list; then
                ok=1
                break
              fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "Odoo did not become reachable in time - skipping module install."
              exit 0
            fi

            echo "--- Discovering databases ---"
            RESPONSE=$(curl -sS --max-time 10 -X POST http://127.0.0.1:8069/web/database/list \
              -H "Content-Type: application/json" \
              -d '{"jsonrpc":"2.0","method":"call","params":{}}' || true)
            DBS=$(printf '%s' "$RESPONSE" | sed -n 's/.*"result":[[:space:]]*\[\(.*\)\].*/\1/p' | tr ',' '\n' | tr -d '" ')

            if [ -z "$DBS" ]; then
              echo "No Odoo databases found yet - skipping module install (will apply once a database exists)."
              exit 0
            fi

            for db in $DBS; do
              echo "Installing/updating custom_login_branding on database: $db"
              sudo docker exec odoo-odoo-1 sh -c \
                'odoo -d "$1" --db_host="$HOST" --db_user="$USER" --db_password="$PASSWORD" -i custom_login_branding -u custom_login_branding --stop-after-init' \
                sh "$db" \
                || echo "WARNING: module install/update failed for database $db"
            done

            sudo docker restart odoo-odoo-1

      - name: Remove uninstalled custom addon (breaks frontend assets otherwise)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            set -euo pipefail
            sudo docker exec odoo-odoo-1 rm -rf /mnt/extra-addons/custom_backend_theme || true
            sudo rm -rf /tmp/odoo-addons-upload
            sudo docker restart odoo-odoo-1
