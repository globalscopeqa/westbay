name: Check System

on:
  workflow_dispatch: {}
  push:
    branches: [main]

jobs:
  external-scan:
    runs-on: ubuntu-latest
    steps:
      - name: One-time external port scan (nmap)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y nmap

          echo "--- Nmap: common service ports ---"
          nmap -Pn -p 21,22,23,25,53,80,110,143,443,993,995,3306,3389,5432,5900,6379,8069,8072,8080,9200,27017 ${{ secrets.VPS_HOST }}

          echo "--- Nmap: full top-1000 port scan with service/version detection ---"
          nmap -Pn -sV ${{ secrets.VPS_HOST }}

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check for OS, Docker image, and network updates
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          script: |
            set -euo pipefail

            echo "--- Disk usage before cleanup ---"
            df -h /

            echo "--- Largest directories ---"
            sudo du -sh /var/log /var/cache /var/lib/docker /opt /home /root /tmp 2>/dev/null | sort -rh

            echo "--- Files over 200MB outside app data (report only, not deleted) ---"
            sudo find / -xdev -type f -size +200M \
              -not -path "/var/lib/docker/*" \
              -not -path "/opt/odoo/*" \
              2>/dev/null

            echo "--- Safe cleanup: apt cache, orphaned packages, old journal logs ---"
            sudo apt-get autoremove -y
            sudo apt-get clean
            sudo journalctl --vacuum-time=7d || true

            echo "--- OS package updates ---"
            sudo apt-get update -q
            apt list --upgradable 2>/dev/null || true

            echo "--- Applying OS package upgrades ---"
            sudo DEBIAN_FRONTEND=noninteractive apt-get upgrade -y
            if [ -f /var/run/reboot-required ]; then
              echo "--- Reboot required after these updates ---"
              cat /var/run/reboot-required.pkgs 2>/dev/null || true
            fi

            echo "--- Removing unused Docker images ---"
            sudo docker image prune -af

            echo "--- Docker images currently in use ---"
            sudo docker images

            echo "--- Checking for newer Odoo/Postgres images ---"
            cd /opt/odoo
            sudo docker compose pull

            echo "--- Harden: firewall + fail2ban ---"
            sudo apt-get install -y ufw fail2ban
            sudo ufw allow 22/tcp
            sudo ufw allow 80/tcp
            sudo ufw allow 443/tcp
            sudo ufw allow 8069/tcp
            sudo ufw allow 8072/tcp
            sudo ufw --force enable
            sudo systemctl enable --now fail2ban

            echo "--- ufw status ---"
            sudo ufw status verbose || true

            echo "--- fail2ban status ---"
            sudo fail2ban-client status || true
            sudo fail2ban-client status sshd || true

            echo "--- Ports listening ---"
            sudo ss -tlnp | grep -E ':80 |:443 |:8069|:8072' || true

            echo "--- Odoo reachability from inside the VPS itself ---"
            curl -sS -w "\nlocal http://127.0.0.1:8069 -> %{http_code}\n" --max-time 5 http://127.0.0.1:8069/ || echo "local request to 8069 failed"

            echo "--- extra-addons contents ---"
            sudo docker exec odoo-odoo-1 ls -la /mnt/extra-addons

            echo "--- Odoo container status ---"
            sudo docker ps -a --filter name=odoo

            echo "--- Odoo container logs (last 80 lines) ---"
            sudo docker logs --tail 80 odoo-odoo-1

            echo "--- Disk usage after cleanup ---"
            df -h /

      - name: One-time deep security & health scan
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          command_timeout: 15m
          script: |
            set -uo pipefail

            echo "=== SYSTEM OVERVIEW ==="
            uname -a
            uptime
            free -h

            echo; echo "=== DISK (blocks) ==="
            df -h

            echo; echo "=== DISK (inodes) ==="
            df -i

            echo; echo "=== TOP PROCESSES BY MEMORY ==="
            ps aux --sort=-%mem | head -40

            echo; echo "=== ALL LISTENING PORTS ==="
            sudo ss -tulnp

            echo; echo "=== LOGGED IN USERS ==="
            who

            echo; echo "=== LAST 30 LOGINS ==="
            last -a -n 30 || true

            echo; echo "=== SUDO GROUP MEMBERS ==="
            getent group sudo

            echo; echo "=== SSH AUTHORIZED KEYS (all users) ==="
            for home in /root /home/*; do
              if sudo test -f "$home/.ssh/authorized_keys"; then
                echo "--- $home/.ssh/authorized_keys ---"
                sudo awk '{print $1, $2, $NF}' "$home/.ssh/authorized_keys"
              fi
            done

            echo; echo "=== SSHD CONFIG (auth-relevant settings) ==="
            sudo grep -E '^(PermitRootLogin|PasswordAuthentication|PubkeyAuthentication|Port|PermitEmptyPasswords)' /etc/ssh/sshd_config || true

            echo; echo "=== SSH LOGIN ACTIVITY (last 7 days, accepted + failed) ==="
            sudo journalctl -u ssh --since "7 days ago" --no-pager | grep -E "Accepted|Failed password" | tail -100 || true

            echo; echo "=== SYSTEM CRON JOBS ==="
            for f in /etc/crontab /etc/cron.d/*; do [ -f "$f" ] && echo "--- $f ---" && cat "$f"; done

            echo; echo "=== ROOT USER CRONTAB ==="
            sudo crontab -l -u root 2>/dev/null || echo "no root crontab"

            echo; echo "=== WORLD-WRITABLE FILES (excluding known noisy paths) ==="
            sudo find / -xdev -type f -perm -0002 \
              -not -path "/proc/*" -not -path "/var/lib/docker/*" -not -path "/tmp/*" -not -path "/var/tmp/*" \
              2>/dev/null | head -50

            echo; echo "=== SUID / SGID BINARIES ==="
            sudo find / -xdev -type f \( -perm -4000 -o -perm -2000 \) 2>/dev/null

            echo; echo "=== nginx config test ==="
            sudo nginx -t

            echo; echo "=== Docker resource usage (snapshot) ==="
            sudo docker stats --no-stream

            echo; echo "=== Docker container details ==="
            sudo docker ps -a

            echo; echo "=== unattended-upgrades status ==="
            systemctl is-enabled unattended-upgrades 2>/dev/null || echo "not installed/enabled"

      - name: One-time rootkit/security scanner (rkhunter + lynis)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_DEPLOY_KEY }}
          command_timeout: 25m
          script: |
            set -uo pipefail

            echo "=== INSTALLING SECURITY SCANNERS (rkhunter + lynis) ==="
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y rkhunter lynis
            echo "install done: $(date)"

            echo; echo "=== RKHUNTER: rootkit / malware scan ==="
            echo "rkhunter update starting: $(date)"
            sudo rkhunter --update --nocolors || true
            echo "rkhunter check starting: $(date)"
            sudo rkhunter --check --sk --nocolors 2>&1 | tail -200
            echo "rkhunter done: $(date)"

            echo; echo "=== LYNIS: security audit (quick) ==="
            echo "lynis starting: $(date)"
            sudo lynis audit system --quick --no-colors 2>&1 | tail -250
            echo "lynis done: $(date)"
